<div class="workshop-info-container">
  <h2 class="title">Ingresa información de tu taller</h2>
  <p class="subtitle">Ingresa la información de tu taller antes de ingresar a la plataforma</p>
  
  <form [formGroup]="workshopForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name" 
          class="form-control" 
          placeholder="Escribe aquí"
        >
      </div>
      
      <div class="img-upload">
        <div class="placeholder-image">
          <img src="assets/logo-placeholder.svg" alt="Logo">
        </div>
        <label class="upload-button">
          <input type="file" (change)="onLogoSelected($event)" accept="image/*">
          Subir logo
        </label>
      </div>
    </div>
    
    <div class="form-group">
      <label for="contactEmail">Correo de contacto</label>
      <input 
        type="email" 
        id="contactEmail" 
        formControlName="contactEmail" 
        class="form-control" 
        placeholder="Escribe aquí"
      >
    </div>
    
    <div class="form-group">
      <label for="contactPhone">Teléfono de contacto</label>
      <input 
        type="tel" 
        id="contactPhone" 
        formControlName="contactPhone" 
        class="form-control" 
        placeholder="Escribe aquí"
      >
    </div>
    
    <div class="form-group">
      <label for="description">Descripción</label>
      <textarea 
        id="description" 
        formControlName="description" 
        class="form-control" 
        placeholder="Escribe aquí" 
        rows="4"
      ></textarea>
    </div>
    
    <div class="form-group">
      <label>Servicios</label>
      <div class="services-list">
        <button 
          type="button" 
          class="service-tag" 
          [class.selected]="selectedServices.includes('Lorem ipsum')" 
          (click)="toggleService('Lorem ipsum')"
        >
          Lorem ipsum
        </button>
        <button 
          type="button" 
          class="service-tag" 
          [class.selected]="selectedServices.includes('Lorem ipsum')" 
          (click)="toggleService('Lorem ipsum')"
        >
          Lorem ipsum
        </button>
        <button 
          type="button" 
          class="service-tag" 
          [class.selected]="selectedServices.includes('Lorem ipsum')" 
          (click)="toggleService('Lorem ipsum')"
        >
          Lorem ipsum
        </button>
        <button 
          type="button" 
          class="service-tag add-service" 
          (click)="toggleService('custom')"
        >
          + Agregar servicios
        </button>
      </div>
    </div>
    
    <div class="form-group">
      <div class="img-upload-large">
        <div class="placeholder-image-large">
          <img src="assets/logo-placeholder.svg" alt="Imagen del taller">
        </div>
        <label class="upload-button">
          <input type="file" (change)="onWorkshopImageSelected($event)" accept="image/*">
          Subir imagen del taller
        </label>
      </div>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="submit-btn" [disabled]="workshopForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Procesando...' : 'Continuar' }}
      </button>
    </div>
  </form>
</div>
